name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-packages:
    name: Test Swift packages
    runs-on: macos-15
    strategy:
      matrix:
        package: [HeyNigelCore, HeyNigelCourseData, HeyNigelWeather]
    steps:
      - uses: actions/checkout@v4
      - name: swift test (${{ matrix.package }})
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  build-app:
    name: Build iOS app (Simulator)
    runs-on: macos-15
    needs: test-packages
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show available simulators
        run: xcrun simctl list devices available iOS | head -30
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project HeyNigel.xcodeproj \
            -scheme HeyNigel \
            -destination "generic/platform=iOS Simulator"

  screenshot-walkthrough:
    name: Onboarding screenshot walkthrough
    runs-on: macos-15
    needs: build-app
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c "import json,sys; data=json.load(sys.stdin); names=[d['name'] for devs in data['devices'].values() for d in devs if 'iPhone' in d['name']]; print(names[0])")
          echo "Using simulator: $DEVICE_NAME"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
      - name: Run onboarding UI test
        run: |
          xcodebuild test \
            -project HeyNigel.xcodeproj \
            -scheme HeyNigel \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device_name }}" \
            -resultBundlePath TestResults.xcresult
      - name: Export screenshots from test results
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool get test-results attachments \
            --path TestResults.xcresult \
            --output-path screenshots
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-screenshots
          path: screenshots
          if-no-files-found: warn
