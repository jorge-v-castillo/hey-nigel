name: HeyNigel
options:
  bundleIdPrefix: com.reneRodriguez.heynigel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HeyNigelCore:
    path: Packages/HeyNigelCore
  HeyNigelCourseData:
    path: Packages/HeyNigelCourseData
  HeyNigelWeather:
    path: Packages/HeyNigelWeather

targets:
  HeyNigel:
    type: application
    platform: iOS
    sources:
      - path: HeyNigel
    dependencies:
      - package: HeyNigelCore
      - package: HeyNigelCourseData
      - package: HeyNigelWeather
    info:
      path: HeyNigel/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Nigel uses your location to detect which hole you're on and calculate distances to the green."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Nigel tracks your location during a round, including while your phone is locked or in your pocket, so hole detection stays accurate the whole round."
        NSMicrophoneUsageDescription: "Nigel listens for your question after you press the AirPods control."
        NSSpeechRecognitionUsageDescription: "Nigel transcribes your spoken question to figure out what you're asking."
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reneRodriguez.heynigel
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  HeyNigel:
    build:
      targets:
        HeyNigel: all
    test:
      targets: []
    run:
      config: Debug
