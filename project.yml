name: HeyNigel
options:
  bundleIdPrefix: com.reneRodriguez.heynigel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HeyNigelCore:
    path: Packages/HeyNigelCore
  HeyNigelCourseData:
    path: Packages/HeyNigelCourseData
  HeyNigelWeather:
    path: Packages/HeyNigelWeather

targets:
  HeyNigel:
    type: application
    platform: iOS
    sources:
      - path: HeyNigel
    dependencies:
      - package: HeyNigelCore
      - package: HeyNigelCourseData
      - package: HeyNigelWeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reneRodriguez.heynigel
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Nigel uses your location to detect which hole you're on and calculate distances to the green."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Nigel tracks your location during a round, including while your phone is locked or in your pocket, so hole detection stays accurate the whole round."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nigel listens for your question after you press the AirPods control."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Nigel transcribes your spoken question to figure out what you're asking."
        INFOPLIST_KEY_NSSiriUsageDescription: "Nigel responds to Siri requests like \"Ask Nigel my distance.\""

schemes:
  HeyNigel:
    build:
      targets:
        HeyNigel: all
    test:
      targets: []
    run:
      config: Debug
